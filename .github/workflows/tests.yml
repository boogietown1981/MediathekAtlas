name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR update supersedes prior jobs; do not consume scarce hosted macOS
# capacity with obsolete versions of the same change.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-regressions:
    name: Netzkino · ArchiveMedia · Unified UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Plattform- und Erkennungsregressionen
        run: |
          cd integration/preview/0.5.31.11
          python -m unittest discover -s tests -v
      - name: Browser-UI-Smoketests
        run: |
          node integration/preview/0.5.31.11/tests/netzkino_ui_smoke.cjs
          node integration/preview/0.5.31.11/tests/netzkino_series_ui_smoke.cjs
          node integration/preview/0.5.31.11/tests/unified_catalog_ui_smoke.cjs

  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: FFmpeg installieren
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg rsync
      - name: Pillow für Paket-Icons installieren
        run: python -m pip install --quiet pillow
      - name: Syntaxprüfung
        run: |
          python -m compileall -q *.py tests vendor/archivemedia
          bash -n launcher.sh
          for f in packaging/nas/*.sh packaging/qnap/shared/*.sh packaging/synology/scripts/* packaging/linux/*.sh; do sh -n "$f"; done
          for f in web/*.js; do node --check "$f"; done
      - name: UI-Smoke-Tests (Netzkino, gemeinsamer Katalog)
        run: for f in tests/*.cjs; do node "$f"; done
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v

  # 0.5.99: the interface in real browsers. WebKit stands in for Safari. Kept apart from the unit
  # tests so that a browser download problem never blocks the packages.
  browser-click:
    name: Klicktest · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Playwright und Browser installieren
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Oberfläche durchklicken
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/browser/click_all.cjs ${{ matrix.browser }}

  # Separate job: macOS runners are sometimes not assigned for a long time; that must not
  # hold back the NAS packages, which only need the Linux results.
  test-macos:
    name: Python 3.13 · macos-15
    # macos-latest is macOS 26 / arm64 and frequently times out without an
    # allocated runner. Pin the stable macOS 15 arm64 pool instead.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: FFmpeg installieren
        run: brew install ffmpeg
      - name: Pillow für Paket-Icons installieren
        run: python -m pip install --quiet pillow
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v
      - name: macOS-App für Preview bauen
        run: |
          python build_macos.py
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/MediathekAtlas.app "dist/MediathekAtlas_v$(python -c 'from version import VERSION;print(VERSION)')_macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MediathekAtlas-macOS-Preview
          path: dist/MediathekAtlas_v*_macOS.zip
          if-no-files-found: error

  # This app uses a shell launcher, Python sources, resources and an Info.plist;
  # it contains no compiled macOS binary, so we can create a distributable .app
  # ZIP on Linux without requiring an Apple runner. This does NOT replace
  # macOS-native integration tests, which remain a separate mandatory check.
  macos-portable:
    name: macOS-App · portable Paketierung auf Linux
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: App-Layout erzeugen
        run: python build_macos.py
      - name: Ausführbares .app-ZIP erstellen und validieren
        run: |
          python packaging/macos_zip.py
          python packaging/macos_zip.py --verify
      - uses: actions/upload-artifact@v4
        with:
          name: MediathekAtlas-macOS-Portable-Unverified
          path: dist/MediathekAtlas_v*_macOS.zip
          if-no-files-found: error

  nas-packages:
    name: NAS-Pakete (SPK + QPKG)
    needs: test
    runs-on: ubuntu-latest
    env:
      QDK_VERSION: v2.5.3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pillow installieren
        run: python -m pip install --quiet pillow
      - name: QNAP QDK installieren (offizielles Build-Werkzeug)
        run: |
          git clone --depth 1 --branch "$QDK_VERSION" https://github.com/qnap-dev/QDK.git "$RUNNER_TEMP/QDK"
          sudo cp -r "$RUNNER_TEMP/QDK/shared" /usr/share/QDK
          sudo mkdir -p /etc/config
          sed -e '2d' "$RUNNER_TEMP/QDK/shared/qdk.conf" | sed '2iQDK_PATH_P=/usr/share' | sudo tee /etc/config/qdk.conf >/dev/null
      - name: Pakete bauen
        run: python build_nas.py --qbuild /usr/share/QDK/bin/qbuild
      - name: Pakete prüfen
        run: |
          set -e
          ls -l dist
          version=$(python -c 'from version import VERSION;print(VERSION)')
          spk="dist/MediathekAtlas-$version-noarch.spk"
          tar tf "$spk" | grep -qx INFO
          tar xOf "$spk" INFO | grep -q "version=\"$version-"
          qpkg=$(ls dist/MediathekAtlas_*.qpkg | head -n 1)
          tail -c 100 "$qpkg" | grep -q 'QNAPQPKG'
          tail -c 100 "$qpkg" | grep -q "MediathekAtlas"
          # QTS rejects packages without the size check written by qpkg_encrypt ("file format error").
          python -c 'import sys,os,build_nas;p=sys.argv[1];d=open(p,"rb").read();sys.exit(0 if d[-60:-50]==build_nas.qpkg_checksum_field(len(d)) else "QPKG-Prüffeld fehlt")' "$qpkg"
          # Extract with the header offsets exactly as QTS does and check the payload.
          mkdir -p qpkg-check && /usr/share/QDK/bin/qbuild --extract "$qpkg" qpkg-check
          ls -l qpkg-check
          grep -q 'QPKG_NAME="MediathekAtlas"' qpkg-check/qpkg.cfg
          # Payload by the header offsets; qbuild --extract copies it via dd from a pipe and is
          # randomly a few bytes short (short reads), so list it with build_nas instead.
          python build_nas.py --list-qpkg "$qpkg" > qpkg-files.txt
          grep -qx './MediathekAtlas.sh' qpkg-files.txt
          grep -qx './mediathekatlas/server.py' qpkg-files.txt
          grep -qx './bin/mediathekatlas-service.sh' qpkg-files.txt
          (cd dist && sha256sum *.spk *.qpkg > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: MediathekAtlas-NAS-Pakete
          path: |
            dist/*.spk
            dist/*.qpkg
            dist/SHA256SUMS
          if-no-files-found: error
