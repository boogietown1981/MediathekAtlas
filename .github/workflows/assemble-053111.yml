name: Assemble 0.5.31.11 integrated source

on:
  push:
    branches:
      - integration/0.5.31.11-complete

permissions:
  contents: write

concurrency:
  group: assemble-053111-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[integrated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify pinned source and fetch ArchiveMedia PR24 separately
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git cat-file -t 89d9438095ddcc0e40c5cc22128b746d2cb9c451)" = commit
          git merge-base --is-ancestor 89d9438095ddcc0e40c5cc22128b746d2cb9c451 HEAD
          test "$(python -c 'from version import VERSION;print(VERSION)')" = '0.5.31'
          git clone --depth 1 --branch feature/external-portals-catalog-adapters \
            https://github.com/boogietown1981/MediathekAtlas.git "$RUNNER_TEMP/archive-pr24"
          test "$(git -C "$RUNNER_TEMP/archive-pr24" rev-parse HEAD)" = c7b6cf9c84a911299a4d1d37f98892959e71fbeb
      - name: Integrate 0.5.31.1 through 0.5.31.11 and PR24
        shell: bash
        run: |
          set -Eeuo pipefail
          PREVIEW='integration/preview/0.5.31.11'
          python "$PREVIEW/apply_preview.py" . --dry-run
          python "$PREVIEW/apply_preview.py" .
          python "$PREVIEW/apply_05311.py" . --dry-run
          python "$PREVIEW/apply_05311.py" .
          python "$PREVIEW/apply_05312.py" . --dry-run
          python "$PREVIEW/apply_05312.py" .
          python "$PREVIEW/merge_portals.py" . --portal-repo "$RUNNER_TEMP/archive-pr24" --dry-run
          python "$PREVIEW/merge_portals.py" . --portal-repo "$RUNNER_TEMP/archive-pr24"
          for patch in 05313 05314 05315 05316 05317 05318 05319 053110 053111; do
            python "$PREVIEW/apply_$patch.py" . --dry-run
            python "$PREVIEW/apply_$patch.py" .
          done
          test "$(python -c 'from version import VERSION;print(VERSION)')" = '0.5.31.11'
      - name: Run all source and UI regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          PREVIEW='integration/preview/0.5.31.11'
          python -m compileall -q . -x '/\.git/'
          python -m pip install --quiet pillow
          python -m unittest discover -s tests -v
          (cd "$PREVIEW" && python -m unittest discover -s tests -v)
          for js in web/*.js; do node --check "$js"; done
          node "$PREVIEW/tests/netzkino_ui_smoke.cjs"
          node "$PREVIEW/tests/netzkino_series_ui_smoke.cjs"
          node "$PREVIEW/tests/unified_catalog_ui_smoke.cjs"
          python build_macos.py
          python packaging/macos_zip.py
          python packaging/macos_zip.py --verify
          python - <<'PY'
          from pathlib import Path
          s=Path('server.py').read_text()
          h=Path('web/index.html').read_text()
          for api in ('/api/archive-companion','/api/portal-archive-inspect',
                      '/api/netzkino-sync','/api/netzkino-grouped',
                      '/api/netzkino-watch','/api/netzkino-reference-report',
                      '/api/netzkino-downloads','/api/video-audit'):
              assert api in s, api
          for marker in ('id="archive-full-mode"','id="netzkino"',
                         'id="video-audit-panel"','id="atlas-main-dashboard"'):
              if marker=='id="atlas-main-dashboard"':
                  assert 'atlas-main-dashboard' in Path('web/unified_catalog.js').read_text()
              else: assert marker in h, marker
          print('Source preservation: OK')
          PY
      - name: Commit complete integration and preserve both PR histories
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'MediathekAtlas Integration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release: MediathekAtlas 0.5.31.11 complete integration [integrated]'
          git fetch --no-tags origin feature/external-portals-catalog-adapters
          test "$(git rev-parse FETCH_HEAD)" = c7b6cf9c84a911299a4d1d37f98892959e71fbeb
          # PR24 source content was already integrated above and verified by tests.
          # The ours-merge records PR24 as the second historical parent without
          # replacing the patched PR23 + Netzkino application with outdated files.
          git merge --no-edit -s ours -m 'Merge PR #24 history: ArchiveMedia portal integration retained' FETCH_HEAD
          git push origin HEAD:integration/0.5.31.11-complete
